version: '3.8'

services:
  # Host Environment SDK Isolation Sandbox
  app:
    image: ruby:3.3
    container_name: ruby-rails-react-auth-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - RAILS_ENV=development
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_user:dev_password@postgresql:5432/ruby-rails-react-auth_db}
    ports:
      - "3000:3000"
    depends_on:
      - postgresql

  # Database Service (postgresql)
  postgresql:
    image: postgres:16-alpine
    container_name: ruby-rails-react-auth-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruby-rails-react-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ruby-rails-react-auth-redis
    ports:
      - "6379:6379"

volumes:
  db_data:
